<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Simple drop shadow for premium look -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Icon Group: Rugged Mountains & Compass/Star -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Mountain Peaks -->
    <path d="M 20 90 L 65 25 L 100 70 L 130 35 L 175 90 Z" fill="none" stroke="#111111" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 45 90 L 80 48 L 105 80" fill="none" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Compass/Star element in the sky -->
    <path d="M 120 15 L 123 23 L 131 26 L 123 29 L 120 37 L 117 29 L 109 26 L 117 23 Z" fill="#d32f2f"/>
    
    <!-- Horizon Ground / Tire Track Line -->
    <line x1="10" y1="98" x2="185" y2="98" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="108" x2="175" y2="108" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Typography Group -->
  <g transform="translate(205, 82)" filter="url(#shadow)">
    <!-- Brand Name: ODYSSEY -->
    <text font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" fill="#111111" letter-spacing="4">ODYSSEY</text>
    <!-- Brand Accent: 4x4 -->
    <text font-family="'Montserrat', 'Inter', 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" fill="#d32f2f" letter-spacing="4" x="285">4x4</text>
    
    <!-- Sub-tagline -->
    <text font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#666666" letter-spacing="6" x="2" y="22">EXPEDITION GEAR</text>
  </g>
</svg>
