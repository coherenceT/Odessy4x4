<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Odyssey 4x4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/header-redesign.css">
</head>

<body>
    <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); padding: 20px;">
        <div
            style="background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 50px 40px;">
            <div style="text-align: center; margin-bottom: 40px;">
                <img src="assets/images/odyssey4x4-logo.jpg" alt="Odyssey 4x4"
                    style="height: 80px; border-radius: 8px; margin-bottom: 20px;">
                <h1 style="font-size: 2rem; margin-bottom: 10px; color: #1a1a1a;">Join The Family</h1>
                <p style="color: #666;">Create your Odyssey 4x4 account</p>
            </div>

            <form id="register-form" style="display: flex; flex-direction: column; gap: 20px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">First
                            Name</label>
                        <input type="text" required placeholder="John"
                            style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Last
                            Name</label>
                        <input type="text" required placeholder="Doe"
                            style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;">
                    </div>
                </div>

                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Email
                        Address</label>
                    <input type="email" required placeholder="your.email@example.com"
                        style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Phone
                        Number</label>
                    <input type="tel" required placeholder="079 123 4567"
                        style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Password</label>
                    <input type="password" required placeholder="Create a strong password"
                        style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Confirm
                        Password</label>
                    <input type="password" required placeholder="Re-enter your password"
                        style="width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem;">
                </div>

                <div>
                    <label style="display: flex; align-items: start; gap: 10px; cursor: pointer;">
                        <input type="checkbox" required style="width: 18px; height: 18px; margin-top: 3px;">
                        <span style="color: #666; font-size: 0.9rem;">I agree to the <a href="privacy-policy.html"
                                style="color: #d32f2f; text-decoration: none;">Terms & Conditions</a> and <a
                                href="privacy-policy.html" style="color: #d32f2f; text-decoration: none;">Privacy
                                Policy</a></span>
                    </label>
                </div>

                <button type="submit"
                    style="width: 100%; padding: 16px; background: #d32f2f; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: background 0.3s; margin-top: 10px;">
                    CREATE ACCOUNT
                </button>

                <div style="text-align: center; margin-top: 20px;">
                    <p style="color: #666;">Already have an account? <a href="login.html"
                            style="color: #d32f2f; text-decoration: none; font-weight: 600;">Login</a></p>
                </div>

                <div style="text-align: center; margin-top: 10px;">
                    <a href="index.html" style="color: #999; text-decoration: none; font-size: 0.9rem;">
                        <i class="fas fa-arrow-left"></i> Back to Homepage
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Registration successful! Account functionality will be implemented with backend integration.');
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
